name: Build Eden FC26 test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'diagnostics/**'
      - 'scripts/**'
      - '.github/workflows/build-fc26.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE: 'true'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/eden
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
      - name: Checkout upstream Eden
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: 67bada77f8a43a90da2e94e89b8e7da73c256989
          path: eden
          submodules: recursive
      - name: Apply NCE null-abort and fault-diagnostics patches
        run: |
          cd eden
          git apply --check ../patches/fc26-null-data-abort.patch
          git apply ../patches/fc26-null-data-abort.patch
          git apply --check ../patches/fc26-fault-diagnostics.patch
          git apply ../patches/fc26-fault-diagnostics.patch
          git apply --check ../diagnostics/fc26-range-and-opcode.patch
          git apply ../diagnostics/fc26-range-and-opcode.patch
          git apply --check ../diagnostics/fc26-trace-x20.patch
          git apply ../diagnostics/fc26-trace-x20.patch
          python3 ../scripts/apply_fc26_safe_probe.py
          python3 ../scripts/fc26_base_only.py
          python3 ../scripts/fc26_cpu_heartbeat.py
          python3 ../scripts/fc26_video_flow.py
          python3 ../scripts/fc26_nifm_offline.py
          python3 ../scripts/fc26_hybrid_romfs.py
          git apply --check ../patches/fc26-acc-load-open-context.patch
          git apply ../patches/fc26-acc-load-open-context.patch
          git apply --check ../patches/fc26-npdm-pointer-buffer.patch
          git apply ../patches/fc26-npdm-pointer-buffer.patch
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config libssl-dev glslang-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle caches
        uses: gradle/actions/setup-gradle@v4
      - name: Restore Ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-android-ndk28-67bada77f8-${{ hashFiles('patches/**/*.patch', 'diagnostics/**/*.patch', 'scripts/**/*.py') }}
          restore-keys: |
            ccache-${{ runner.os }}-android-ndk28-67bada77f8-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build APK
        working-directory: eden
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh --target standard --build-type Release --nightly
      - name: Ccache statistics
        if: always()
        run: ccache --show-stats
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-fc26-test
          path: |
            eden/artifacts/*.apk
            eden/artifacts/**/*.apk
            eden/src/android/app/build/outputs/**/*.apk
          if-no-files-found: warn
